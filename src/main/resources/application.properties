spring.application.name=microservicio-tienda

server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/microservicio_db}
spring.datasource.username=${DB_USERNAME:tienda}
spring.datasource.password=${DB_PASSWORD:tienda123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
